<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workday Candidate Application Mock</title>
</head>
<body>
  <div data-automation-id="workdayApplication">
    <div data-automation-id="formField-legalNameSection_firstName" class="form-group">
      <label for="input-1" data-automation-id="formLabel">First Name</label>
      <input id="input-1" data-automation-id="legalNameSection_firstName" name="legalNameSection_firstName" type="text" />
    </div>

    <div data-automation-id="formField-legalNameSection_lastName" class="form-group">
      <label for="input-2" data-automation-id="formLabel">Last Name</label>
      <input id="input-2" data-automation-id="legalNameSection_lastName" name="legalNameSection_lastName" type="text" />
    </div>

    <div data-automation-id="formField-email" class="form-group">
      <label for="input-3" data-automation-id="formLabel">Email Address</label>
      <input id="input-3" data-automation-id="email" name="email" type="email" />
    </div>

    <div data-automation-id="formField-phone" class="form-group">
      <label for="input-4" data-automation-id="formLabel">Phone Number</label>
      <input id="input-4" data-automation-id="phone-number" name="phoneNumber" type="tel" />
    </div>

    <div data-automation-id="formField-city" class="form-group">
      <label for="input-5" data-automation-id="formLabel">City / Location</label>
      <input id="input-5" data-automation-id="addressSection_city" name="city" type="text" />
    </div>

    <div data-automation-id="formField-title" class="form-group">
      <label for="input-6" data-automation-id="formLabel">Current Job Title</label>
      <input id="input-6" data-automation-id="jobTitle" name="jobTitle" type="text" />
    </div>

    <div data-automation-id="formField-yoe" class="form-group">
      <label for="input-7" data-automation-id="formLabel">Total Years of Experience</label>
      <input id="input-7" data-automation-id="yearsOfExperience" name="yoe" type="text" />
    </div>

    <div data-automation-id="formField-resume" class="form-group">
      <label for="input-8" data-automation-id="formLabel">Resume / CV</label>
      <input id="input-8" data-automation-id="fileUpload" type="file" name="resumeFile" />
    </div>
  </div>
</body>
</html>
