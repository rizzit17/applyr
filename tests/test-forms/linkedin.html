<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LinkedIn Easy Apply Mock</title>
</head>
<body>
  <div class="jobs-easy-apply-content">
    <h3>Contact info</h3>
    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:1">First name</label>
      <input id="urn:li:fs_easyApplyFormElement:1" name="firstName" autocomplete="given-name" type="text" />
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:2">Last name</label>
      <input id="urn:li:fs_easyApplyFormElement:2" name="lastName" autocomplete="family-name" type="text" />
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:3">Email address</label>
      <input id="urn:li:fs_easyApplyFormElement:3" name="emailAddress" type="email" autocomplete="email" />
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:4">Phone country code</label>
      <select id="urn:li:fs_easyApplyFormElement:4" name="phoneCountryCode">
        <option value="US">United States (+1)</option>
        <option value="CA">Canada (+1)</option>
      </select>
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:5">Mobile phone number</label>
      <input id="urn:li:fs_easyApplyFormElement:5" name="phoneNumber" type="tel" />
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:6">City, state, or zip code</label>
      <input id="urn:li:fs_easyApplyFormElement:6" name="cityStateZip" type="text" />
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:7">LinkedIn Profile</label>
      <input id="urn:li:fs_easyApplyFormElement:7" name="linkedInProfile" type="url" />
    </div>

    <div class="jobs-easy-apply-form-section__grouping">
      <label for="urn:li:fs_easyApplyFormElement:8">Resume</label>
      <input id="urn:li:fs_easyApplyFormElement:8" type="file" name="file" />
    </div>
  </div>
</body>
</html>
