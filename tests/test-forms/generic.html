<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generic ATS Career Page Mock</title>
</head>
<body>
  <form id="generic-careers-form">
    <div class="row">
      <div class="col">
        <label for="fname">Given Name</label>
        <input type="text" id="fname" name="fname" placeholder="John" />
      </div>
      <div class="col">
        <label for="lname">Surname</label>
        <input type="text" id="lname" name="lname" placeholder="Smith" />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="usr-email">Email</label>
        <input type="email" id="usr-email" name="email" placeholder="john@example.com" />
      </div>
      <div class="col">
        <label for="usr-phone">Contact Number</label>
        <input type="tel" id="usr-phone" name="phone" placeholder="+1..." />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="linkedin-input">LinkedIn Profile URL</label>
        <input type="text" id="linkedin-input" name="linkedin" />
      </div>
      <div class="col">
        <label for="github-input">GitHub Profile</label>
        <input type="text" id="github-input" name="github" />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="college">University / Institution</label>
        <input type="text" id="college" name="school" />
      </div>
      <div class="col">
        <label for="grad-yr">Graduation Year</label>
        <input type="number" id="grad-yr" name="graduationYear" />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label for="cover">Briefly describe your experience and why you are interested</label>
        <textarea id="cover" name="coverLetter"></textarea>
      </div>
    </div>
  </form>
</body>
</html>
