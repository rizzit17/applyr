<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lever Application Mock</title>
</head>
<body>
  <form id="lever-application-form">
    <div class="application-question">
      <label>
        <span class="text">Full name</span>
        <input type="text" name="name" placeholder="First and last name" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">Email</span>
        <input type="email" name="email" placeholder="you@example.com" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">Phone</span>
        <input type="tel" name="phone" placeholder="(555) 000-0000" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">Current company / role</span>
        <input type="text" name="org" placeholder="Current job title" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">LinkedIn URL</span>
        <input type="text" name="urls[LinkedIn]" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">GitHub URL</span>
        <input type="text" name="urls[GitHub]" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">Portfolio URL</span>
        <input type="text" name="urls[Portfolio]" />
      </label>
    </div>

    <div class="application-question">
      <label>
        <span class="text">Additional Information / Note to hiring manager</span>
        <textarea name="comments" placeholder="Add a cover letter or anything else you would like to share."></textarea>
      </label>
    </div>
  </form>
</body>
</html>
